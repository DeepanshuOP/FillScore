name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      JWT_ACCESS_SECRET: test1
      JWT_REFRESH_SECRET: test2
      GOOGLE_CLIENT_ID: x
      GOOGLE_CLIENT_SECRET: x
      GITHUB_CLIENT_ID: x
      GITHUB_CLIENT_SECRET: x
      MONGODB_URI: mongodb://127.0.0.1:27017/fillscore_test
      PORT: "3001"
      BINANCE_API_KEY: test-key
      BINANCE_API_SECRET: test-secret
      ENCRYPTION_KEY: 6470df2f901f61569c667de386f434a71f51e1f2d44c913698859b16e42054cd
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: npm ci
        working-directory: backend
        run: npm ci

      - name: npm test
        working-directory: backend
        run: npm test -- --no-file-parallelism

      - name: tsc --noEmit
        working-directory: backend
        run: npx tsc --noEmit

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: vitest run
        working-directory: frontend
        run: npx vitest run

      - name: tsc --noEmit
        working-directory: frontend
        run: npx tsc --noEmit

      - name: npm run build
        working-directory: frontend
        run: npm run build

  ml-service:
    runs-on: ubuntu-latest
    env:
      JWT_ACCESS_SECRET: test-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - name: pip install
        working-directory: ml-service
        run: pip install -r requirements.txt

      - name: pytest
        working-directory: ml-service
        run: pytest -m "not integration"
