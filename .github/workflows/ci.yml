name: CI

# Every job is offline and secret-free: dummy env values only, mongodb-memory-server or a mongo service
# container, no live LLM or exchange calls. Live tests are excluded exactly as locally (pytest.ini addopts
# `-m "not integration"`, vitest excludes *.network.test.ts).
# Render deploys only after these checks pass (render.yaml: autoDeployTrigger: checksPass).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Secret scan of the full git history (M1.1, closes R6-G13). gitleaks is pinned and its SHA-256 checked against
  # the release's checksums file. Rules: .gitleaks.toml (defaults + MongoDB URI passwords). Known non-secrets and the
  # rotated pre-2026-06 credentials are listed by fingerprint in .gitleaksignore; any other finding fails the job.
  secrets:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
      - name: Scan history
        run: ./gitleaks git --no-banner --redact --config .gitleaks.toml --exit-code 1 .

  backend:
    runs-on: ubuntu-24.04
    env:
      JWT_ACCESS_SECRET: test1
      JWT_REFRESH_SECRET: test2
      GOOGLE_CLIENT_ID: x
      GOOGLE_CLIENT_SECRET: x
      GITHUB_CLIENT_ID: x
      GITHUB_CLIENT_SECRET: x
      MONGODB_URI: mongodb://127.0.0.1:27017/fillscore_test
      PORT: "3001"
      BINANCE_API_KEY: test-key
      BINANCE_API_SECRET: test-secret
      ENCRYPTION_KEY: 6470df2f901f61569c667de386f434a71f51e1f2d44c913698859b16e42054cd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      # after npm ci: npm ci deletes node_modules, which would wipe a binary restored earlier
      - name: Cache mongodb-memory-server binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/node_modules/.cache/mongodb-memory-server
          key: mongoms-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
      # Dependency audit gate (production dependencies). Rules and the allowance for a build-time advisory with no
      # fix: scripts/audit_gate.py, security/audit-allowlist.json, SECURITY.md. No job is added by these steps.
      - run: python3 scripts/audit_gate.py npm backend
      - run: npx tsc --noEmit
        working-directory: backend
      - run: npm test -- --no-file-parallelism
        working-directory: backend

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: python3 scripts/audit_gate.py npm frontend
      - run: npx tsc --noEmit --incremental false
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npx vitest run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  mcp:   # the read-only MCP server (mcp-server/): tools, and the real server process end to end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
        working-directory: mcp-server
      - run: npm test
        working-directory: mcp-server
      - run: python3 scripts/audit_gate.py npm mcp-server

  ml-service:
    runs-on: ubuntu-24.04
    env:
      JWT_ACCESS_SECRET: test-secret
      GROQ_API_KEY: bogus
      OPENROUTER_API_KEY: bogus
      MONGODB_URI: mongodb://127.0.0.1:1/x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-service/requirements.lock
      - run: pip install -r requirements.lock
        working-directory: ml-service
      # pip-audit is pinned; --disable-pip and --no-deps audit exactly the versions in the lock file.
      - run: pip install pip-audit==2.10.1
      - run: python3 ../scripts/audit_gate.py pip requirements.lock
        working-directory: ml-service
      # pytest.ini addopts already deselects integration (live) tests; stated again so it cannot be lost.
      - run: pytest -p no:cacheprovider -m "not integration"
        working-directory: ml-service

  # Offline Council eval: stored demo fixtures + recorded responses vs the golden-set invariants.
  # Pure Python, no secrets, no network; fails on any invariant violation.
  eval:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-service/requirements.lock
      - run: pip install -r requirements.lock
        working-directory: ml-service
      - run: python evals/run_offline.py
        working-directory: ml-service

  e2e:
    needs: [backend, frontend, ml-service, mcp]
    runs-on: ubuntu-24.04
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      E2E_MONGO_PORT: "27017"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-service/requirements.lock
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: pip install -r requirements.lock
        working-directory: ml-service
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
