name: CI

# Every job is offline and secret-free: dummy env values only, mongodb-memory-server or a mongo service
# container, no live LLM or exchange calls. Live tests are excluded exactly as locally (pytest.ini addopts
# `-m "not integration"`, vitest excludes *.network.test.ts).
# Render deploys only after these checks pass (render.yaml: autoDeployTrigger: checksPass).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    env:
      JWT_ACCESS_SECRET: test1
      JWT_REFRESH_SECRET: test2
      GOOGLE_CLIENT_ID: x
      GOOGLE_CLIENT_SECRET: x
      GITHUB_CLIENT_ID: x
      GITHUB_CLIENT_SECRET: x
      MONGODB_URI: mongodb://127.0.0.1:27017/fillscore_test
      PORT: "3001"
      BINANCE_API_KEY: test-key
      BINANCE_API_SECRET: test-secret
      ENCRYPTION_KEY: 6470df2f901f61569c667de386f434a71f51e1f2d44c913698859b16e42054cd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      # after npm ci: npm ci deletes node_modules, which would wipe a binary restored earlier
      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v6
        with:
          path: backend/node_modules/.cache/mongodb-memory-server
          key: mongoms-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
      - run: npx tsc --noEmit
        working-directory: backend
      - run: npm test -- --no-file-parallelism
        working-directory: backend

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit --incremental false
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npx vitest run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  ml-service:
    runs-on: ubuntu-24.04
    env:
      JWT_ACCESS_SECRET: test-secret
      GROQ_API_KEY: bogus
      OPENROUTER_API_KEY: bogus
      MONGODB_URI: mongodb://127.0.0.1:1/x
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-service/requirements.lock
      - run: pip install -r requirements.lock
        working-directory: ml-service
      # pytest.ini addopts already deselects integration (live) tests; stated again so it cannot be lost.
      - run: pytest -p no:cacheprovider -m "not integration"
        working-directory: ml-service

  # Offline Council eval: stored demo fixtures + recorded responses vs the golden-set invariants.
  # Pure Python, no secrets, no network; fails on any invariant violation.
  eval:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-service/requirements.lock
      - run: pip install -r requirements.lock
        working-directory: ml-service
      - run: python evals/run_offline.py
        working-directory: ml-service

  e2e:
    needs: [backend, frontend, ml-service]
    runs-on: ubuntu-24.04
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      E2E_MONGO_PORT: "27017"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-service/requirements.lock
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: pip install -r requirements.lock
        working-directory: ml-service
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
