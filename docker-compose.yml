# ==============================================================================
# LOCAL DEV ONLY — Docker Compose for FillScore Backend & ML-Service
# ==============================================================================
# - Mongo is managed via MongoDB Atlas (NOT containerised here).
# - Redis is NOT included yet (planned for T4.6).
# - Both services read environment variables via env_file pointing to their
#   local .env files (never commit .env secrets or hardcode values).
# ==============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./ml-service/.env
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
